version: '3.8'

services:
  map_api:
    build: .
    container_name: map_microservice
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      - NODE_ENV=production
      - PORT=8085
      - REDIS_HOST=redis_cache
      - REDIS_PORT=6379
      - DB_HOST=mysql_db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASS=rootpassword
      - DB_NAME=map_tracker
      - JWT_SECRET=your_jwt_secret_here
    depends_on:
      - redis_cache
      - mysql_db
    mem_limit: 250m
    cpus: "0.5"

  redis_cache:
    image: redis:7-alpine
    container_name: map_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    mem_limit: 100m

  mysql_db:
    image: mysql:8.0
    container_name: map_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: map_tracker
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    mem_limit: 500m

volumes:
  mysql_data:
